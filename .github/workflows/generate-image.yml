name: Génération Image + Déploiement Pages

on:
  push:
    branches: [ "main" ]
    paths-ignore:  # <-- IMPORTANT : ignore les commits de l'Action
      - 'image/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # <-- pour avoir l'historique des commits
      
      - name: Récupérer le message du commit
        id: commit
        run: echo "msg=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT
      
      - name: Créer l'image SVG
        run: |
          MSG="${{ steps.commit.outputs.msg }}"
          mkdir -p image
          cat > image/image.svg << EOL
          <svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
            <rect width="800" height="400" fill="#2563eb"/>
            <text x="400" y="200" font-family="Arial" font-size="50" fill="white" text-anchor="middle" font-weight="bold">$MSG</text>
          </svg>
          EOL
      
      - name: Commit l'image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add image/image.svg
          git diff --staged --quiet || git commit -m "Auto: Génère image pour [${{ steps.commit.outputs.msg }}]"
          git push
