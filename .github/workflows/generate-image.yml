name: Add Discord notification workflow for image changes

on:
  push:
    paths:
      - 'image/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Read test.txt
        run: cat test.txt
      
      - name: Create SVG
        run: |
          echo '<svg width="200" height="200"><circle cx="100" cy="100" r="80" fill="green"/></svg>' > image/output.svg
      
      - name: Commit image
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add image/output.svg
          git commit -m "Generate SVG Image" || echo "No changes to commit"
          git push
      
      - name: Send Discord notification
        if: ${{ github.event_name == 'push' }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "🖼️ Nouvelle image ajoutée par ${{ github.actor }}", "embeds": [{"title": "Image Uploadée", "description": "Fichier ajouté dans /image/", "color": 5814783}]}' \
          ${{ secrets.DISCORD_WEBHOOK }}
