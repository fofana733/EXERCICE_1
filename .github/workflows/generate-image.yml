name: Génération Image + Déploiement Pages
on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Créer le dossier images
        run: mkdir -p images

      - name: Récupérer message du commit
        id: commit
        run: |
          echo "MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT
          echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Générer l'image via DynaPictures
        id: dynapic
        run: |
          RESPONSE=$(curl -s -X POST "https://api.dynapictures.com/design/generate" \
          -H "Authorization: Bearer ${{ secrets.DYNAPICTURES_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg text "${{ steps.commit.outputs.MESSAGE }}" '{template_id: "default", text: $text}')")
          echo "URL=$(echo $RESPONSE | jq -r .url)" >> $GITHUB_OUTPUT

      - name: Télécharger l'image
        run: |
          curl -o images/${{ steps.commit.outputs.SHA }}.png "${{ steps.dynapic.outputs.URL }}"

      - name: Générer index.html
        run: |
          mkdir -p public
          echo '<!DOCTYPE html><html><head><title>Galerie</title><style>body{font-family:Arial;text-align:center} img{margin:10px;border-radius:8px}</style></head><body><h1>Ma Galerie IA - EXERCICE_1</h1>' > public/index.html
          for img in images/*.png; do
            echo "<div><p>Image: $img</p><img src=\"../$img\" width=\"300\"></div>" >> public/index.html
          done
          echo '</body></html>' >> public/index.html

      - name: Committer l'image
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add images/
          git commit -m "Add image for commit ${{ steps.commit.outputs.SHA }}" || echo "No changes"
          git push
      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
