name: Génération Image + Déploiement Pages

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Générer l'image SVG
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Message du commit: $COMMIT_MSG"
          mkdir -p image
          cat > image/image.svg << EOF
          <svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
            <rect width="800" height="400" fill="#1e3a8a"/>
            <text x="400" y="200" font-family="Arial" font-size="60" fill="white" text-anchor="middle" font-weight="bold">$COMMIT_MSG</text>
          </svg>
          EOF
      
      - name: Déployer sur GitHub Pages
        uses: actions/deploy-pages@v4
