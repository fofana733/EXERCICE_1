name: Generate SVG Image

on:
  push:
    paths-ignore:
      - 'image/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read test.txt
        id: read
        run: echo "content=$(cat test.txt)" >> $GITHUB_OUTPUT

      - name: Create SVG
        run: |
          mkdir -p image
          echo '<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">' > image/image.svg
          echo '<rect width="800" height="200" fill="#2563eb"/>' >> image/image.svg
          echo '<text x="400" y="100" font-family="Arial" font-size="28" fill="white" text-anchor="middle" dominant-baseline="middle">${{ steps.read.outputs.content }}</text>' >> image/image.svg
          echo '</svg>' >> image/image.svg

      - name: Commit image
        run: |
          git config --global user.name 'actions-user'
          git config --global user.email 'actions@github.com'
          git add image/image.svg
          git commit -m "Auto: Génère image pour [${{ steps.read.outputs.content }}]" || exit 0
          git push
