name: Génération Image + Déploiement Pages

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Créer l'image SVG
        run: |
          MSG="${{ github.event.head_commit.message }}"
          mkdir -p image
          cat > image/image.svg << EOL
          <svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
            <rect width="800" height="400" fill="#2563eb"/>
            <text x="400" y="200" font-family="Arial" font-size="50" fill="white" text-anchor="middle" font-weight="bold">$MSG</text>
          </svg>
          EOL
      
      - name: Commit l'image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add image/image.svg
          git diff --staged --quiet || git commit -m "Auto: Génère image pour [$MSG]"
          git push
