name: Commenter PR Auto

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  commenter:  # <- j'ai changé ici
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer message du commit
        id: commit
        run: echo "MSG=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT

      - name: Poster le commentaire
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo,
              body: 🤖 Message du dernier commit :\n> ${process.env.MSG} # <- backticks ajoutés
            })
        env:
          MSG: ${{ steps.commit.outputs.MSG }}
